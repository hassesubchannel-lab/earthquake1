<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地震シミュレーター</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="titlebar">
  <h1>地震シミュレーター</h1>
  <span class="notice">これはシミュレーションです。実際の地震情報ではありません。</span>
</header>

<div id="controls">
  <label>プリセット
    <select id="preset"></select>
  </label>
  <label>緯度 <input id="lat" type="number" step="0.01" value="33.30"></label>
  <label>経度 <input id="lon" type="number" step="0.01" value="135.90"></label>
  <label>深さ <input id="depth" type="number" step="1" value="20">km</label>
  <label>M <input id="mag" type="number" step="0.1" value="9.1"></label>
  <label>種類
    <select id="qtype">
      <option value="0">地殻内</option>
      <option value="-0.02">プレート境界</option>
      <option value="0.12">プレート内</option>
    </select>
  </label>
  <span class="sep"></span>
  <button id="modeHypo" class="mode">震源を置く</button>
  <button id="modeFaultA" class="mode">断層の端A</button>
  <button id="modeFaultB" class="mode">断層の端B</button>
  <button id="clearFault">断層クリア</button>
  <span class="sep"></span>
  <label>P波 <input id="vp" type="number" step="0.1" value="7.1">km/s</label>
  <label>S波 <input id="vs" type="number" step="0.1" value="4.0">km/s</label>
  <label><input id="useDonet" type="checkbox" checked>DONET</label>
  <label><input id="useSnet" type="checkbox" checked>S-net</label>
  <label><input id="usePlum" type="checkbox" checked>PLUM法</label>
  <span class="sep"></span>
  <button id="play" class="primary">再生</button>
  <button id="back">&lt; 10秒</button>
  <button id="fwd">10秒 &gt;</button>
  <label>速さ
    <select id="speed">
      <option value="1">1倍</option><option value="2">2倍</option>
      <option value="5">5倍</option><option value="10">10倍</option>
    </select>
  </label>
  <label><input id="sound" type="checkbox" checked>音</label>
</div>

<main id="stage">
  <section id="mainWrap">
    <div id="mainMap"></div>
    <div id="timer">00:00:00.00</div>
    <div id="infoPanel">
      <div class="tabs">
        <button data-tab="eew" class="active">緊急地震速報</button>
        <button data-tab="info">地震情報</button>
      </div>
      <div id="tab-eew" class="tabbody"></div>
      <div id="tab-info" class="tabbody hidden"></div>
    </div>
    <img id="maxPanel" class="hidden" alt="">
    <div id="infoBar" class="hidden">
      <img src="img/info-bar.png" alt="">
      <span id="ibDay"></span><span id="ibHour"></span><span id="ibMin"></span><span id="ibMag"></span>
    </div>
    <div id="hint"></div>
  </section>
  <aside id="side">
    <div id="zoomWrap">
      <div id="zoomMap"></div>
      <select id="zoomCity"></select>
    </div>
    <div id="eewWrap">
      <div id="eewMap"></div>
      <div id="eewLabel"></div>
    </div>
  </aside>
</main>

<footer id="credits">
  背景地図：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>
  ／ 区域：気象庁「地震情報／細分区域」GISデータを加工
  ／ 震度パーツ：ニコニ・コモンズ nc351709
  ／ 地図ライブラリ：<a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a>
  ／ 震度は簡易な計算式による推定で、実際の地震とは異なります。
</footer>

<script src="lib/leaflet.js"></script>
<script src="data/areas.js"></script>
<script src="app.js"></script>
</body>
</html>
